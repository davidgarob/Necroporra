<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NECROPORRA 🪦</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 1300px;
      margin: auto;
      padding: 2rem;
    }
    h1 { text-align: center; }
    #tabs {
      text-align: center;
      margin-bottom: 2rem;
    }
    #tabs button {
      margin: 0.25rem 0.5rem;
      padding: 0.5rem 1rem;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
    }
    #tabs button.activo {
      background: #333;
      color: #fff;
      border-color: #333;
    }
    #main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 2rem;
    }
    #estadisticas, #ranking, #ganador, #seccion-global {
      background: #f3f3f3;
      padding: 1rem;
      border-radius: 8px;
    }
    #ganador {
      text-align: center;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #estado-año {
      font-size: 0.9rem;
      color: #666;
      margin-top: 0.75rem;
    }
    #detalle {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-top: 3rem;
    }
    .jugador {
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .muerto {
      text-decoration: line-through;
      color: red;
    }
    .titulo-seccion {
      font-weight: bold;
      text-align: center;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      padding: 0.5rem;
      border: 1px solid #ccc;
      text-align: center;
    }
    td:first-child { text-align: left; font-weight: bold; }
    #nota-global {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #555;
    }
    #aviso-datos {
      background: #fff3cd;
      border: 1px solid #e0c36a;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }

    @media (max-width: 768px) {
      #main-layout { grid-template-columns: 1fr; }
      #detalle { grid-template-columns: 1fr; }
      #seccion-global { overflow-x: auto; }
    }
    #curiosidades {
  margin-top: 2rem;
  padding: 1rem 1rem 1rem 2.5rem;
  background: #f3f3f3;
  border-radius: 8px;
}
#curiosidades:empty { display: none; }
#curiosidades li { margin: 0.4rem 0; }
.estrellas { color: #c9a227; letter-spacing: 1px; font-size: 0.85em; }
#tabla-estadisticas td:first-child { white-space: nowrap; }
#grafica { margin-top: 2rem; overflow-x: auto; }
@media (max-width: 768px) { #grafica svg { min-width: 560px; } }
#grafica svg { width: 100%; height: auto; display: block; background: #fff; border-radius: 8px; }
#grafica .nota { font-size: 0.85rem; color: #555; margin-top: 0.5rem; }
    
  </style>
</head>
<body>
  <h1>NECROPORRA 🪦</h1>
  <div id="aviso-datos"></div>
  <div id="tabs"></div>

  <!-- VISTA POR AÑO -->
  <div id="vista-año">
    <div id="main-layout">
      <div id="estadisticas">
        <div class="titulo-seccion">Estadísticas</div>
        <div id="tabla-estadisticas"></div>
      </div>
      <div id="ganador">
        <div>
          <div class="titulo-seccion">Ganador del año</div>
          <div id="nombre-ganador"></div>
          <div id="estado-año"></div>
        </div>
      </div>
      <div id="ranking">
        <div class="titulo-seccion">Ranking</div>
        <div id="tabla-ranking"></div>
      </div>
    </div>
    <div id="detalle"></div>
    <ul id="curiosidades"></ul>
  </div>

  <!-- VISTA GLOBAL -->
  <div id="vista-global" style="display: none;">
    <div id="seccion-global">
      <div class="titulo-seccion">🏅 Estadísticas globales</div>
      <div id="tabla-global"></div>
      <div id="grafica"></div>
      <p id="los-cinco-grandes"></p>
      <p id="mas-elegidos"></p>
      <p id="nota-global"></p>
    </div>
  </div>

  <script src="datos.js"></script>
  <script src="stats.js"></script>
  <script>
    let añoSeleccionado = AÑOS[AÑOS.length - 1];

    // ---------- Formato ----------
    const num = (n, d = 1) => n === null || n === undefined ? "-" : n.toFixed(d).replace(".", ",");
    const pct = n => num(n, 1) + "%";
    const nombre = id => famoso(id).nombre;
    const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

    // Estrellas = victorias en años cerrados hasta ese año (sin año: todas)
    const estrellas = (j, año) => {
      const n = victoriasHasta(j, año);
      return n ? ` <span class="estrellas" title="${plural(n, "victoria", "victorias")}">${"★".repeat(n)}</span>` : "";
    };

    // ---------- Pestañas ----------
    function pintarTabs(activa) {
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = AÑOS.map(a =>
        `<button class="${activa === a ? "activo" : ""}" onclick="cambiarAño(${a})">${a}</button>`
      ).join("") +
        `<button class="${activa === "global" ? "activo" : ""}" onclick="mostrarEstadisticas()">🏅 Estadísticas</button>`;
    }

    function cambiarAño(año) {
      añoSeleccionado = año;
      document.getElementById("vista-año").style.display = "block";
      document.getElementById("vista-global").style.display = "none";
      pintarTabs(año);
      renderAño();
    }

    function mostrarEstadisticas() {
      document.getElementById("vista-año").style.display = "none";
      document.getElementById("vista-global").style.display = "block";
      pintarTabs("global");
      renderGlobal();
    }

    // ---------- Vista por año ----------
    function renderAño() {
      const año = añoSeleccionado;
      const porra = PORRAS[año];
      const ranking = rankingDe(año);

      document.getElementById("tabla-ranking").innerHTML = `
        <ol>
          ${ranking.map(r => `<li><strong>${r.nombre}</strong>${estrellas(r.nombre, año)}: ${plural(r.puntos, "punto", "puntos")}</li>`).join("")}
        </ol>`;

      const ganadores = ganadoresDe(año);
      document.getElementById("nombre-ganador").innerHTML =
        ganadores.length ? ganadores.map(g => `🏆 ${g}${estrellas(g, año)}`).join("<br>") : "—";
      document.getElementById("estado-año").textContent =
        porra.cerrado ? "" : (ganadores.length ? "Provisional: el año sigue en juego" : "El año sigue en juego");

      const cabecera = `<tr><th>Jugador</th><th>Edad media</th><th>Aciertos</th><th>Edad media aciertos</th></tr>`;
      const filas = jugadoresDe(año).map(j => {
        const ids = seleccionesDe(año, j);
        const hits = aciertosDe(año, j);
        return `<tr>
          <td>${j}${estrellas(j, año)}</td>
          <td>${num(media(ids.map(id => edadEn(id, año))))}</td>
          <td>${hits.length}</td>
          <td>${num(media(hits.map(id => edadEn(id, año))))}</td>
        </tr>`;
      }).join("");
      document.getElementById("tabla-estadisticas").innerHTML = `<table>${cabecera}${filas}</table>`;

      document.getElementById("detalle").innerHTML = jugadoresDe(año).map(j => `
        <div class="jugador">
          <h3>${j}${estrellas(j, año)}</h3>
          <ul>
            ${seleccionesDe(año, j).map(id => `
              <li class="${porra.muertos.includes(id) ? "muerto" : ""}">
                ${nombre(id)} (${edadEn(id, año)} años)
              </li>`).join("")}
          </ul>
        </div>`).join("");
      const cur = porra.curiosidades || [];
  document.getElementById("curiosidades").innerHTML =
    cur.map(t => `<li>${t}</li>`).join("");
    }

    // ---------- Vista global ----------
    function renderGlobal() {
      const st = estadisticasGlobales();
      const fila = (etiqueta, fn) =>
        `<tr><td>${etiqueta}</td>${st.map(s => `<td>${fn(s)}</td>`).join("")}</tr>`;

      const lista = ids => ids.map(nombre).join(", ");
      const conAños = a => a.años.join(", ");
      const aciertosEmpatados = arr =>
        arr.map(x => `${nombre(x.id)}`).join(" / ") + ` (${arr[0].edad})`;

      document.getElementById("tabla-global").innerHTML = `
        <table>
          <tr><th></th>${st.map(s => `<th>${s.jugador}${estrellas(s.jugador)}</th>`).join("")}</tr>
          ${fila("Promedio edad", s => num(s.edadMedia))}
          ${fila("Victorias", s => s.victorias)}
          ${fila("Aciertos totales", s => s.aciertos)}
          ${fila("Mejor racha de victorias", s => s.mejorRacha)}
          ${fila("% de aciertos (sobre selecciones)", s => pct(s.pctAciertos))}
          ${fila("Personas únicas elegidas", s => s.unicos)}
          ${fila("% de ellas ya fallecidas", s => `${pct(s.pctMuertos)} (${s.unicosMuertos})`)}
          ${fila("Prom. edad más bajo", s => `${num(s.mediaMasBaja.media)} (${s.mediaMasBaja.año})`)}
          ${fila("Prom. edad más alto", s => `${num(s.mediaMasAlta.media)} (${s.mediaMasAlta.año})`)}
          ${fila("Año con más aciertos", s => `${s.mejorAño.n} (${conAños(s.mejorAño)})`)}
          ${fila("Cucharas de madera", s => s.cucharas)}
          ${fila("Persona más repetida", s => `${lista(s.masRepetido.ids)} (${s.masRepetido.veces})`)}
          ${fila("Acierto más joven", s => s.aciertoJoven ? aciertosEmpatados(s.aciertoJoven) : "-")}
          ${fila("Acierto más mayor", s => s.aciertoMayor ? aciertosEmpatados(s.aciertoMayor) : "-")}
          ${TRAMOS.map(t => fila(`% ${t} años`, s => pct(s.pctTramos[t]))).join("")}
        </table>`;

      renderGrafica();

      document.getElementById("los-cinco-grandes").textContent =
        `👑 Los grandes (elegidos por todos en algún momento): ${lista(losGrandes()).replaceAll(", ", " · ")}`;

      const top = masElegidos();
      document.getElementById("mas-elegidos").textContent =
        `📌 Más veces elegido: ${lista(top.ids).replaceAll(", ", " · ")} · ${top.veces} veces`;

      const abiertos = AÑOS.filter(a => !PORRAS[a].cerrado);
      document.getElementById("nota-global").textContent =
        "Edades calculadas con la edad que tenía cada famoso en el año de la porra. " +
        (abiertos.length
          ? `Victorias, rachas y cucharas solo cuentan años cerrados (${abiertos.join(", ")} sigue en juego); aciertos y porcentajes sí incluyen ese año.`
          : "");
    }

    // ---------- Gráfica de puntos acumulados ----------
    function renderGrafica() {
      const datos = puntosAcumulados();
      const colores = ["#2563eb", "#d97706", "#0d9488", "#9333ea", "#be123c"];
      const W = 640, H = 320, m = { t: 20, r: 95, b: 40, l: 36 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const maxY = Math.max(...datos.flatMap(d => d.puntos.map(p => p.total)));
      const top = Math.max(2, Math.ceil(maxY / 2) * 2);
      const x = i => m.l + (AÑOS.length === 1 ? iw / 2 : (i * iw) / (AÑOS.length - 1));
      const y = v => m.t + ih - (v / top) * ih;

      let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntos acumulados por jugador y año">`;

      // Rejilla y eje Y
      for (let v = 0; v <= top; v += 2) {
        svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e5e5"/>`;
        svg += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#666">${v}</text>`;
      }
      // Eje X
      AÑOS.forEach((a, i) => {
        svg += `<text x="${x(i)}" y="${H - 16}" text-anchor="middle" font-size="11" fill="#666">${a}</text>`;
      });

      // Líneas (discontinuas en el tramo del año en curso) y puntos
      datos.forEach((d, k) => {
        const c = colores[k % colores.length];
        for (let i = 1; i < d.puntos.length; i++) {
          const dash = PORRAS[AÑOS[i]].cerrado ? "" : ` stroke-dasharray="5 4"`;
          svg += `<line x1="${x(i - 1)}" y1="${y(d.puntos[i - 1].total)}" x2="${x(i)}" y2="${y(d.puntos[i].total)}" stroke="${c}" stroke-width="2.5"${dash}/>`;
        }
        d.puntos.forEach((p, i) => {
          svg += `<circle cx="${x(i)}" cy="${y(p.total)}" r="4" fill="${c}"><title>${d.jugador}, ${p.año}: ${p.total} acumulados</title></circle>`;
        });
      });

      // Etiquetas al final de cada línea, separadas si se pisan
      const ultimo = AÑOS.length - 1;
      const etiquetas = datos
        .map((d, k) => ({ d, k, y: y(d.puntos[ultimo].total) }))
        .sort((a, b) => a.y - b.y);
      for (let i = 1; i < etiquetas.length; i++) {
        if (etiquetas[i].y - etiquetas[i - 1].y < 14) etiquetas[i].y = etiquetas[i - 1].y + 14;
      }
      etiquetas.forEach(e => {
        svg += `<text x="${x(ultimo) + 10}" y="${e.y + 4}" font-size="12" font-weight="bold" fill="${colores[e.k % colores.length]}">${e.d.jugador} ${e.d.puntos[ultimo].total}</text>`;
      });
      svg += `</svg>`;

      const abiertos = AÑOS.filter(a => !PORRAS[a].cerrado);
      document.getElementById("grafica").innerHTML =
        `<div class="titulo-seccion">Puntos acumulados</div>${svg}` +
        (abiertos.length ? `<div class="nota">Línea discontinua: año en curso (${abiertos.join(", ")}).</div>` : "");
    }

    // ---------- Arranque ----------
    const avisos = validarDatos();
    if (avisos.length) {
      const caja = document.getElementById("aviso-datos");
      caja.style.display = "block";
      caja.innerHTML = "<strong>Revisar datos:</strong><br>" + avisos.join("<br>");
    }
    cambiarAño(añoSeleccionado);
  </script>
</body>
</html>
